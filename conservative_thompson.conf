# conservative_thompson.conf
# Configures Leela Chess Zero for more conservative play with Thompson Sampling.

# Enable Beta-Bernoulli Thompson Sampling
# true or false
UseBetaBernoulli=true

# Policy temperature for initializing Beta priors in Thompson Sampling.
# Lower values lead to sharper initial priors (less exploration, more exploitation of policy).
# Range: e.g., 0.01 to 100.0
PolicyTemperature=0.5

# First Play Urgency (FPU) value/bonus for unvisited Thompson Sampling nodes.
# 0.0 means relying purely on the (potentially sharpened by temperature) policy prior.
# Range: e.g., 0.0 to 1.0
ThompsonFPU=0.0
