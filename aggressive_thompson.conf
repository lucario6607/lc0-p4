# aggressive_thompson.conf
# Configures Leela Chess Zero for aggressive exploration with Thompson Sampling.

# Enable Beta-Bernoulli Thompson Sampling
# true or false
UseBetaBernoulli=true

# Policy temperature for initializing Beta priors in Thompson Sampling.
# Higher values lead to flatter initial priors (more exploration).
# Range: e.g., 0.01 to 100.0
PolicyTemperature=3.0

# First Play Urgency (FPU) value/bonus for unvisited Thompson Sampling nodes.
# A small bonus to encourage exploring completely unvisited branches.
# Range: e.g., 0.0 to 1.0
ThompsonFPU=0.2
